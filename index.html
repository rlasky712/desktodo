<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DeskTodo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>DeskTodo</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f7fa; --chip:#eef0f5; --line:#e4e7ee; --fg:#1f2330; --sub:#6b7285;
    --dim:#a6abb8; --accent:#3b6fe0; --accent-soft:#e8f0ff; --red:#e5484d; --warn:#e08a00; --sat:#2f7fd8;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input{font:inherit;color:var(--fg)}
  .hidden{display:none!important}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header{padding:calc(18px + var(--safe-t)) 20px 8px}
  header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
  header p{margin:3px 0 0;color:var(--sub);font-size:13px}
  main{flex:1;padding:4px 16px calc(150px + var(--safe-b))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:5}
  nav.tabs button{flex:1;max-width:186px;padding:10px 0 12px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--accent);font-weight:700}
  .card{background:var(--panel);border-radius:12px}
  .ddrow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;margin-bottom:6px}
  .ddrow b{color:var(--accent)}
  .today-ev{font-size:13px;color:var(--sub);padding:2px 4px 8px}
  .sec{font-size:12px;color:var(--sub);font-weight:700;margin:14px 4px 6px}
  .todo{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0}
  .cb{width:22px;height:22px;flex:0 0 22px;border:2px solid var(--dim);border-radius:6px;margin-top:1px;display:grid;place-items:center}
  .cb.on{background:var(--accent);border-color:var(--accent)}
  .cb.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .todo .t{flex:1;min-width:0;word-break:break-word}
  .todo .t.done{color:var(--dim);text-decoration:line-through}
  .due{font-size:12px;color:var(--sub);margin-top:3px}
  .due.soon{color:var(--warn);font-weight:700}
  .due.over{color:var(--red);font-weight:700}
  .empty{color:var(--dim);text-align:center;padding:36px 0;font-size:14px}
  .addbar{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));padding:8px 12px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));z-index:4}
  .addbar .in{max-width:536px;margin:0 auto;display:flex;gap:6px;align-items:center;background:var(--chip);border-radius:12px;padding:4px 4px 4px 12px}
  .addbar input[type=text]{flex:1;border:0;background:none;outline:none;padding:9px 0;min-width:0}
  .addbar .time{border:0;background:#fff;border-radius:8px;padding:7px 6px;font-size:14px;color:var(--sub);width:92px}
  .btn{background:var(--accent);color:#fff;border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px}
  .btn.ghost{background:var(--chip);color:var(--fg)}
  .btn.danger{background:#fdecec;color:var(--red)}
  /* calendar */
  .calnav{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px}
  .calnav h2{margin:0;font-size:20px}
  .calnav .b{display:flex;gap:6px}
  .calnav .b button{background:var(--chip);border-radius:8px;padding:6px 11px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .wk{text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding:4px 0}
  .wk.sun,.d.sun .n{color:var(--red)} .wk.sat,.d.sat .n{color:var(--sat)}
  .d{background:var(--panel);border-radius:8px;min-height:62px;padding:4px 3px;font-size:10px;overflow:hidden;border:1.5px solid transparent}
  .d.out{background:#fafbfc}.d.out .n{color:var(--dim)!important}
  .d.sel{border-color:var(--accent);background:var(--accent-soft)}
  .d .n{font-weight:700;font-size:12px;display:inline-block;min-width:20px;text-align:center;border-radius:6px;padding:1px 2px}
  .d.today .n{background:var(--accent);color:#fff!important}
  .d .l{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
  .dayhead{margin:18px 4px 6px;display:flex;justify-content:space-between;align-items:baseline}
  .dayhead h3{margin:0;font-size:17px}
  .dayhead span{color:var(--sub);font-size:12px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .grow{flex:1;min-width:0}
  .x{color:var(--dim);font-size:15px;padding:4px 6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .inline{display:flex;gap:6px;margin-top:10px}
  .inline input{flex:1;min-width:0;border:0;background:var(--chip);border-radius:10px;padding:10px 12px;outline:none}
  .badge{min-width:64px;text-align:center;background:var(--accent);color:#fff;border-radius:8px;padding:6px 4px;font-weight:800;font-size:14px}
  .badge.past{background:var(--chip);color:var(--sub)}
  .star{font-size:22px;color:var(--dim);padding:0 4px}
  .star.on{color:var(--accent)}
  .small{font-size:12px;color:var(--sub)}
  .hint{font-size:12px;color:var(--sub);margin:10px 4px}
  /* sheet */
  .back{position:fixed;inset:0;background:rgba(20,24,35,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--safe-b))}
  .sheet h4{margin:0 0 12px;font-size:17px}
  .sheet label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px}
  .sheet input{width:100%;border:0;background:var(--chip);border-radius:10px;padding:11px 12px;outline:none}
  .sheet .two{display:flex;gap:8px}
  .sheet .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .sheet .quick button{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px}
  .sheet .acts{display:flex;gap:8px;margin-top:18px}
  .sheet .acts .btn{flex:1;padding:12px}
  /* auth */
  .auth{max-width:380px;margin:12vh auto 0;padding:0 24px}
  .auth h1{font-size:28px;margin:0 0 6px}
  .auth p{color:var(--sub);margin:0 0 24px;font-size:14px}
  .auth input{width:100%;border:0;background:var(--chip);border-radius:12px;padding:14px;margin-bottom:10px;outline:none}
  .auth .btn{width:100%;padding:14px;font-size:16px}
  .auth .msg{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
  .auth .msg.ok{color:var(--accent)}
  .link{color:var(--accent);font-size:14px;margin-top:16px;display:block;text-align:center}
  .menu{position:absolute;right:16px;top:calc(18px + var(--safe-t))}
  .menu button{background:var(--chip);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--sub)}
  .sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2bb673;margin-left:6px;vertical-align:middle}
  .sync.off{background:var(--dim)}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <h1>DeskTodo</h1>
  <p id="authSub">노트북 위젯과 같은 계정으로 로그인하세요.</p>
  <input id="email" type="email" placeholder="이메일" autocomplete="email">
  <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
  <div id="authMsg" class="msg"></div>
  <button id="authBtn" class="btn">로그인</button>
  <button id="authToggle" class="link">처음이면 회원가입</button>
</div>

<div id="app" class="hidden">
  <header style="position:relative">
    <h1 id="hDate"></h1>
    <p id="hSub"></p>
    <div class="menu"><button id="menuBtn">설정</button></div>
  </header>
  <main>
    <section id="tab-todo"></section>
    <section id="tab-cal" class="hidden"></section>
    <section id="tab-dday" class="hidden"></section>
  </main>
  <div id="addbar" class="addbar">
    <div class="in">
      <input id="newTodo" type="text" placeholder="할 일 추가" enterkeyhint="done">
      <input id="newTime" class="time" type="time" title="마감시간 (선택)">
      <button id="addTodo" class="btn">추가</button>
    </div>
  </div>
  <nav class="tabs">
    <button data-tab="todo" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>할 일</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>달력</button>
    <button data-tab="dday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>디데이</button>
  </nav>
</div>
<div id="sheetRoot"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (s) => document.querySelector(s);
const WEEK = ["일","월","화","수","목","금","토"];
const S = { todos: [], events: [], ddays: [], tab: "todo", month: null, sel: null, live: false };

// ---------- date helpers
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fromIso = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const ddayText = (dateStr) => { const n = daysBetween(today(), fromIso(dateStr)); return n > 0 ? `D-${n}` : n === 0 ? "D-Day" : `D+${-n}`; };
const kdate = (d) => `${d.getMonth()+1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}요일`;
const newId = () => crypto.randomUUID().replace(/-/g, "").slice(0, 10);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function dueInfo(dueStr) {
  const due = new Date(dueStr), now = new Date();
  const hm = `${pad(due.getHours())}:${pad(due.getMinutes())}`;
  const sameDay = iso(due) === iso(now);
  const when = sameDay ? hm : `${due.getMonth()+1}/${due.getDate()} ${hm}`;
  const mins = Math.floor((due - now) / 60000);
  if (mins < 0) return [`${when} 지남`, "over"];
  if (mins < 60) return [`${when} · ${mins}분 남음`, "soon"];
  if (mins < 180) return [`${when} · ${Math.floor(mins/60)}시간 ${mins%60}분`, "soon"];
  return [sameDay ? `${when} 까지` : when, ""];
}

// ---------- auth
let signupMode = false;
function showAuth() { $("#auth").classList.remove("hidden"); $("#app").classList.add("hidden"); }
$("#authToggle").onclick = () => {
  signupMode = !signupMode;
  $("#authBtn").textContent = signupMode ? "회원가입" : "로그인";
  $("#authToggle").textContent = signupMode ? "이미 계정이 있어요" : "처음이면 회원가입";
  $("#authMsg").textContent = "";
};
$("#authBtn").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#pw").value;
  const msg = $("#authMsg"); msg.className = "msg"; msg.textContent = "";
  if (!email || password.length < 6) { msg.textContent = "이메일과 6자 이상 비밀번호를 입력하세요."; return; }
  $("#authBtn").disabled = true;
  try {
    if (signupMode) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) { msg.className = "msg ok"; msg.textContent = "인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인하세요."; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) {
    msg.textContent = /Invalid login/i.test(e.message) ? "이메일 또는 비밀번호가 맞지 않아요." :
      /not confirmed/i.test(e.message) ? "메일 인증을 먼저 완료해 주세요." :
      /not allowed|disabled/i.test(e.message) ? "새 가입이 막혀 있어요." : e.message;
  } finally { $("#authBtn").disabled = false; }
};
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#authBtn").click(); });

sb.auth.onAuthStateChange((_ev, session) => { session ? startApp() : (stopLive(), showAuth()); });

// ---------- data
async function load() {
  const [t, e, d] = await Promise.all([
    sb.from("todos").select("*"), sb.from("events").select("*"), sb.from("ddays").select("*"),
  ]);
  if (t.error || e.error || d.error) { console.error(t.error || e.error || d.error); return; }
  S.todos = t.data; S.events = e.data; S.ddays = d.data;
  render();
}
let chan = null, started = false;
function startApp() {
  $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden");
  if (started) return; started = true;
  S.month = new Date(today().getFullYear(), today().getMonth(), 1); S.sel = today();
  load();
  chan = sb.channel("desktodo")
    .on("postgres_changes", { event: "*", schema: "public" }, () => debounceLoad())
    .subscribe((st) => { S.live = st === "SUBSCRIBED"; renderHeader(); });
}
function stopLive() { if (chan) sb.removeChannel(chan); chan = null; started = false; }
let lt = null; const debounceLoad = () => { clearTimeout(lt); lt = setTimeout(load, 250); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && started) load(); });
setInterval(() => { if (started && S.tab === "todo") renderTodos(); }, 30000);

async function run(p) { const { error } = await p; if (error) { alert("저장 실패: " + error.message); } await load(); }

// ---------- render
function render() { renderHeader(); renderTodos(); renderCal(); renderDday(); }
function renderHeader() {
  $("#hDate").textContent = kdate(new Date());
  const left = S.todos.filter((t) => !t.done).length, done = S.todos.length - left;
  $("#hSub").innerHTML = `남은 할 일 ${left}개${done ? ` · 완료 ${done}개` : ""}<span class="sync ${S.live ? "" : "off"}" title="${S.live ? "실시간 동기화 중" : "연결 중"}"></span>`;
}
function sortedTodos() {
  const un = S.todos.filter((t) => !t.done);
  const withDue = un.filter((t) => t.due).sort((a, b) => new Date(a.due) - new Date(b.due));
  const noDue = un.filter((t) => !t.due).sort((a, b) => a.position - b.position);
  const done = S.todos.filter((t) => t.done).sort((a, b) => a.position - b.position);
  return [...withDue, ...noDue, ...done];
}
function pinnedDdays() {
  const t = iso(today());
  let p = S.ddays.filter((d) => d.pinned).sort((a, b) => a.date.localeCompare(b.date));
  if (!p.length) p = S.ddays.filter((d) => d.date >= t).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 1);
  return p.slice(0, 3);
}
function renderTodos() {
  renderHeader();
  const el = $("#tab-todo"); let h = "";
  for (const d of pinnedDdays()) h += `<div class="card ddrow" data-go="dday"><span>${esc(d.title)}</span><b>${ddayText(d.date)}</b></div>`;
  const tev = S.events.filter((e) => e.date === iso(today())).map((e) => e.title).sort();
  if (tev.length) h += `<div class="today-ev" data-go="cal">오늘 일정 · ${tev.map(esc).join(", ")}</div>`;
  const list = sortedTodos();
  if (!list.length) h += `<div class="empty">할 일을 추가해 보세요</div>`;
  else {
    h += `<div>`;
    for (const t of list) {
      let due = "";
      if (t.due) { const [txt, lv] = dueInfo(t.due); due = `<div class="due ${t.done ? "" : lv}">${txt}</div>`; }
      h += `<div class="todo"><button class="cb ${t.done ? "on" : ""}" data-toggle="${t.id}" aria-label="완료"></button>
        <div class="t ${t.done ? "done" : ""}" data-edit="${t.id}">${esc(t.text)}${due}</div></div>`;
    }
    h += `</div>`;
    if (S.todos.some((t) => t.done)) h += `<div style="text-align:center;margin-top:14px"><button class="btn ghost" id="clearDone">완료한 할 일 지우기</button></div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => {
    const t = S.todos.find((x) => x.id === b.dataset.toggle); t.done = !t.done; renderTodos();
    run(sb.from("todos").update({ done: t.done }).eq("id", t.id));
  });
  el.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editTodo(S.todos.find((x) => x.id === b.dataset.edit)));
  el.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => setTab(b.dataset.go));
  const cd = $("#clearDone"); if (cd) cd.onclick = () => {
    const ids = S.todos.filter((t) => t.done).map((t) => t.id);
    if (confirm(`완료한 할 일 ${ids.length}개를 지울까요?`)) run(sb.from("todos").delete().in("id", ids));
  };
}
$("#addTodo").onclick = addTodo;
$("#newTodo").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) addTodo(); });
function addTodo() {
  const text = $("#newTodo").value.trim(); if (!text) return;
  const time = $("#newTime").value;
  const pos = S.todos.length ? Math.max(...S.todos.map((t) => t.position)) + 1 : 0;
  const row = { id: newId(), text, done: false, position: pos, due: time ? new Date(`${iso(today())}T${time}`).toISOString() : null };
  $("#newTodo").value = ""; $("#newTime").value = "";
  S.todos.push({ ...row }); renderTodos();
  run(sb.from("todos").insert(row));
}

function sheet(html, bind) {
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="back"><div class="sheet">${html}</div></div>`;
  const close = () => (root.innerHTML = "");
  root.querySelector(".back").onclick = (e) => { if (e.target.classList.contains("back")) close(); };
  bind(root, close);
}
function editTodo(t) {
  const d = t.due ? new Date(t.due) : null;
  sheet(`<h4>할 일 수정</h4>
    <label>내용</label><input id="eText" value="${esc(t.text)}">
    <label>마감</label><div class="two"><input id="eDate" type="date" value="${d ? iso(d) : iso(today())}"><input id="eTime" type="time" value="${d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : ""}"></div>
    <div class="quick"><button data-q="12:00">12:00</button><button data-q="18:00">18:00</button><button data-q="21:00">21:00</button><button data-q="23:59">23:59</button><button data-q="">마감 없음</button></div>
    <div class="acts"><button class="btn danger" id="eDel">삭제</button><button class="btn ghost" id="eTop">맨 위로</button><button class="btn" id="eSave">저장</button></div>`,
  (r, close) => {
    r.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => (r.querySelector("#eTime").value = b.dataset.q));
    r.querySelector("#eDel").onclick = () => { close(); run(sb.from("todos").delete().eq("id", t.id)); };
    r.querySelector("#eTop").onclick = () => {
      close(); const min = Math.min(...S.todos.map((x) => x.position));
      run(sb.from("todos").update({ position: min - 1 }).eq("id", t.id));
    };
    r.querySelector("#eSave").onclick = () => {
      const text = r.querySelector("#eText").value.trim() || t.text;
      const date = r.querySelector("#eDate").value, time = r.querySelector("#eTime").value;
      const due = time ? new Date(`${date || iso(today())}T${time}`).toISOString() : null;
      close(); run(sb.from("todos").update({ text, due }).eq("id", t.id));
    };
  });
}

// ---------- calendar
function renderCal() {
  const el = $("#tab-cal"), m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());
  const evBy = {}, ddBy = {};
  for (const e of S.events) (evBy[e.date] ||= []).push(e.title);
  for (const d of S.ddays) (ddBy[d.date] ||= []).push(d.title);
  let h = `<div class="calnav"><h2>${y}년 ${mo+1}월</h2><div class="b"><button id="cPrev">◀</button><button id="cNext">▶</button><button id="cToday">오늘</button></div></div><div class="grid">`;
  WEEK.forEach((w, i) => h += `<div class="wk ${i===0?"sun":i===6?"sat":""}">${w}</div>`);
  const t = iso(today()), s = iso(S.sel);
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d);
    const lines = [...(ddBy[k] || []).map((x) => "★ " + x), ...(evBy[k] || []).sort().map((x) => "• " + x)];
    const shown = lines.length > 2 ? [lines[0], `+${lines.length - 1}`] : lines;
    h += `<div class="d ${d.getMonth()!==mo?"out":""} ${k===t?"today":""} ${k===s?"sel":""} ${d.getDay()===0?"sun":d.getDay()===6?"sat":""}" data-day="${k}">
      <span class="n">${d.getDate()}</span>${shown.map((l) => `<div class="l">${esc(l)}</div>`).join("")}</div>`;
  }
  h += `</div>`;
  const n = daysBetween(today(), S.sel);
  h += `<div class="dayhead"><h3>${kdate(S.sel)}</h3><span>${n===0?"오늘":n>0?`${n}일 후`:`${-n}일 전`}</span></div><div class="card">`;
  const dds = S.ddays.filter((d) => d.date === s), evs = S.events.filter((e) => e.date === s).sort((a, b) => a.title.localeCompare(b.title));
  for (const d of dds) h += `<div class="row"><span style="color:var(--accent)">★</span><div class="grow"><b>${esc(d.title)}</b> <span class="small">${ddayText(d.date)}</span></div></div>`;
  for (const e of evs) h += `<div class="row"><span class="dot"></span><div class="grow">${esc(e.title)}</div><button class="x" data-delev="${e.id}">✕</button></div>`;
  if (!dds.length && !evs.length) h += `<div class="empty" style="padding:22px 0">일정이 없어요</div>`;
  h += `</div><div class="inline"><input id="newEv" placeholder="일정 추가 (예: 14:00 회의)" enterkeyhint="done"><button class="btn" id="addEv">추가</button></div>
    <button class="link" id="toDday">이 날짜로 디데이 만들기 ›</button>`;
  el.innerHTML = h;
  $("#cPrev").onclick = () => { S.month = new Date(y, mo - 1, 1); renderCal(); };
  $("#cNext").onclick = () => { S.month = new Date(y, mo + 1, 1); renderCal(); };
  $("#cToday").onclick = () => { S.sel = today(); S.month = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1); renderCal(); };
  el.querySelectorAll("[data-day]").forEach((c) => c.onclick = () => {
    S.sel = fromIso(c.dataset.day);
    if (S.sel.getMonth() !== mo) S.month = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
    renderCal();
  });
  el.querySelectorAll("[data-delev]").forEach((b) => b.onclick = () => run(sb.from("events").delete().eq("id", b.dataset.delev)));
  const add = () => { const v = $("#newEv").value.trim(); if (!v) return; $("#newEv").value = ""; run(sb.from("events").insert({ id: newId(), date: s, title: v })); };
  $("#addEv").onclick = add;
  $("#newEv").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) add(); });
  $("#toDday").onclick = () => { setTab("dday"); $("#ddDate").value = s; $("#ddTitle").focus(); };
}

// ---------- dday
function renderDday() {
  const el = $("#tab-dday"), t = iso(today());
  const up = S.ddays.filter((d) => d.date >= t).sort((a, b) => a.date.localeCompare(b.date));
  const past = S.ddays.filter((d) => d.date < t).sort((a, b) => b.date.localeCompare(a.date));
  const keepTitle = $("#ddTitle")?.value || "", keepDate = $("#ddDate")?.value || iso(S.sel || today());
  let h = `<div class="card">`;
  if (!S.ddays.length) h += `<div class="empty">아직 디데이가 없어요</div>`;
  for (const d of [...up, ...past]) {
    const dt = fromIso(d.date), isPast = d.date < t;
    h += `<div class="row"><div class="badge ${isPast ? "past" : ""}">${ddayText(d.date)}</div>
      <div class="grow"><b style="${isPast ? "color:var(--sub)" : ""}">${esc(d.title)}</b><div class="small">${d.date.replaceAll("-", ".")} (${WEEK[dt.getDay()]})</div></div>
      <button class="star ${d.pinned ? "on" : ""}" data-pin="${d.id}">${d.pinned ? "★" : "☆"}</button><button class="x" data-deldd="${d.id}">✕</button></div>`;
  }
  h += `</div><p class="hint">★ 표시한 디데이는 할 일 화면과 노트북 위젯 위쪽에 고정돼요. 없으면 가장 가까운 디데이가 보여요.</p>
    <div class="inline"><input id="ddTitle" placeholder="디데이 이름"></div>
    <div class="inline"><input id="ddDate" type="date"><button class="btn" id="addDd">추가</button></div>`;
  el.innerHTML = h;
  $("#ddTitle").value = keepTitle; $("#ddDate").value = keepDate;
  el.querySelectorAll("[data-pin]").forEach((b) => b.onclick = () => {
    const d = S.ddays.find((x) => x.id === b.dataset.pin);
    run(sb.from("ddays").update({ pinned: !d.pinned }).eq("id", d.id));
  });
  el.querySelectorAll("[data-deldd]").forEach((b) => b.onclick = () => {
    const d = S.ddays.find((x) => x.id === b.dataset.deldd);
    if (confirm(`'${d.title}' 디데이를 지울까요?`)) run(sb.from("ddays").delete().eq("id", d.id));
  });
  $("#addDd").onclick = () => {
    const title = $("#ddTitle").value.trim(), date = $("#ddDate").value;
    if (!title || !date) { alert("이름과 날짜를 입력하세요."); return; }
    $("#ddTitle").value = "";
    run(sb.from("ddays").insert({ id: newId(), title, date, pinned: false }));
  };
}

// ---------- tabs & menu
function setTab(k) {
  S.tab = k;
  for (const n of ["todo", "cal", "dday"]) $("#tab-" + n).classList.toggle("hidden", n !== k);
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === k));
  $("#addbar").classList.toggle("hidden", k !== "todo");
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.onclick = () => setTab(b.dataset.tab));
$("#menuBtn").onclick = async () => {
  const { data } = await sb.auth.getUser();
  sheet(`<h4>설정</h4><p class="small">로그인: ${esc(data.user?.email || "")}</p>
    <p class="small">홈 화면에 추가하면 앱처럼 쓸 수 있어요.<br>아이폰: Safari 공유 버튼 → 홈 화면에 추가<br>안드로이드: Chrome 메뉴 → 홈 화면에 추가</p>
    <div class="acts"><button class="btn ghost" id="mClose">닫기</button><button class="btn danger" id="mOut">로그아웃</button></div>`,
  (r, close) => {
    r.querySelector("#mClose").onclick = close;
    r.querySelector("#mOut").onclick = async () => { close(); await sb.auth.signOut(); };
  });
};

const { data: { session } } = await sb.auth.getSession();
session ? startApp() : showAuth();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
